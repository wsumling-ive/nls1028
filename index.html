<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>張國榮星途啟航 - 搶答賽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f4eee0;
            color: #3e4a3d;
        }

        /* 水彩畫背景與疊加效果 */
        .watercolor-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('Gemini_Generated_Image_ipapofipapofipap (1)_2.jpg');
            background-size: cover;
            background-position: center;
            z-index: -2;
            opacity: 0.6;
        }

        /* 增加紙張紋理與柔和濾鏡，營造吉卜力水彩感 */
        .texture-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(240, 244, 238, 0.9) 100%);
            z-index: -1;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }

        /* 遊戲主容器，帶有水彩紙般的柔和邊緣與陰影 */
        .game-container {
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 30px rgba(92, 107, 90, 0.15), 
                        inset 0 0 20px rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(200, 210, 195, 0.5);
            border-radius: 24px;
            backdrop-filter: blur(10px);
        }

        /* 按鈕水彩風設計 */
        .btn-watercolor {
            background: linear-gradient(120deg, #c3d8c1 0%, #e0e9df 100%);
            color: #2c3e2e;
            border: 1px solid #b2c9b0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .btn-watercolor:hover {
            transform: translateY(-2px);
            background: linear-gradient(120deg, #b2c9b0 0%, #c3d8c1 100%);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .btn-watercolor:active {
            transform: translateY(1px);
        }

        /* 選項按鈕狀態 */
        .option-btn {
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #d3ded2;
            color: #4a5c49;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: #e8f0e7;
            border-color: #a3bca1;
        }
        .option-btn.correct {
            background: #c2e0c0 !important;
            border-color: #7ab577 !important;
            color: #1a4218 !important;
        }
        .option-btn.wrong {
            background: #f0c9c9 !important;
            border-color: #d97777 !important;
            color: #5c1818 !important;
        }

        /* 計時器進度條 */
        .timer-bar-container {
            background: #e2e8e1;
            border-radius: 999px;
            overflow: hidden;
        }
        .timer-bar {
            height: 100%;
            background: linear-gradient(90deg, #8cbaa5, #a3c9b7);
            border-radius: 999px;
            transition: width 0.1s linear, background-color 0.3s ease;
        }
        .timer-bar.urgent {
            background: linear-gradient(90deg, #d98f8f, #e6b3b3);
        }

        /* 動畫 */
        .fade-in { animation: fadeIn 0.5s ease forwards; }
        .fade-out { animation: fadeOut 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-10px); } }

        /* 隱藏元素 */
        .hidden { display: none !important; }

        /* 龍虎榜與輸入框樣式 */
        .input-watercolor {
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #b2c9b0;
            color: #2c3e2e;
            transition: all 0.3s ease;
        }
        .input-watercolor:focus {
            outline: none;
            border-color: #7ab577;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 8px rgba(122, 181, 119, 0.3);
        }
        .leaderboard-container {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            border: 1px solid #d3ded2;
            max-height: 45vh;
            overflow-y: auto;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen py-10 overflow-x-hidden overflow-y-auto">

    <div class="watercolor-bg"></div>
    <div class="texture-overlay"></div>

    <main class="game-container relative w-11/12 max-w-2xl p-8 md:p-12 text-center fade-in">
        
        <!-- 封面/開始畫面 -->
        <div id="start-screen" class="block">
            <h1 class="text-4xl md:text-5xl font-black mb-4 text-[#2c3e2e] leading-tight">
                張國榮星途啟航
            </h1>
            <h2 class="text-xl md:text-2xl mb-8 text-[#5c6d5b]">
                「今生約定」搶答賽
            </h2>
            <p class="mb-8 text-[#4a5c49] leading-relaxed">
                跟隨哥哥初入行的足跡，回顧那些充滿人情味與辛酸的起步故事。<br>
                共 15 題，每題有 10 秒搶答時間。準備好了嗎？
            </p>
            <button onclick="startGame()" class="btn-watercolor px-8 py-3 rounded-full text-lg font-bold">
                開始挑戰
            </button>
        </div>

        <!-- 遊戲畫面 -->
        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-center mb-6 text-[#5c6d5b] font-bold">
                <div class="text-lg">題目: <span id="current-question-text">1</span> / 15</div>
                <div class="text-lg">分數: <span id="score-text">0</span></div>
            </div>

            <div class="timer-bar-container w-full h-3 mb-8">
                <div id="timer-bar" class="timer-bar w-full"></div>
            </div>

            <h3 id="question-title" class="text-2xl md:text-3xl font-bold mb-8 text-[#2c3e2e] leading-relaxed min-h-[5rem]">
                載入題目中...
            </h3>

            <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <!-- 選項會透過 JS 動態生成 -->
            </div>

            <div id="feedback-message" class="text-lg font-bold min-h-[2rem] opacity-0 transition-opacity duration-300">
                <!-- 答對/答錯提示 -->
            </div>
        </div>

        <!-- 結算畫面 -->
        <div id="result-screen" class="hidden w-full">
            <h2 class="text-4xl font-black mb-6 text-[#2c3e2e]">挑戰完成！</h2>
            <p class="text-2xl mb-4 text-[#4a5c49]">你的最終得分是：</p>
            <div class="text-6xl font-black text-[#5c6d5b] mb-8" id="final-score">0</div>
            <p id="result-comment" class="text-lg mb-8 text-[#4a5c49] leading-relaxed">
                <!-- 評語 -->
            </p>
            
            <!-- 龍虎榜提交區塊 -->
            <div class="mb-6 max-w-sm mx-auto">
                <input type="text" id="player-name" placeholder="輸入名字以記錄成績" maxlength="15" class="input-watercolor w-full px-4 py-3 rounded-xl text-center mb-2 text-lg font-bold">
                <div id="name-feedback" class="text-sm text-[#a84e4e] h-4 mb-2 font-bold"></div>
                <button id="submit-score-btn" onclick="submitScore()" class="btn-watercolor w-full py-3 rounded-full text-lg font-bold shadow-md">
                    提交成績並查看龍虎榜
                </button>
                <button onclick="skipToLeaderboard()" class="text-[#5c6d5b] underline text-sm mt-4 inline-block hover:text-[#2c3e2e] transition-colors">
                    跳過並查看龍虎榜
                </button>
            </div>
        </div>

        <!-- 龍虎榜畫面 -->
        <div id="leaderboard-screen" class="hidden w-full">
            <h2 class="text-3xl md:text-4xl font-black mb-6 text-[#2c3e2e]">🏆 龍虎榜</h2>
            <div class="leaderboard-container mb-8 p-2">
                <ul id="leaderboard-list" class="text-left w-full flex flex-col gap-1">
                    <!-- 排名會透過 JS 動態生成 -->
                </ul>
            </div>
            <button onclick="resetGame()" class="btn-watercolor px-8 py-3 rounded-full text-lg font-bold shadow-md">
                再玩一次
            </button>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 初始化與全域變數
        let app, db, auth, currentUser = null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        let localLeaderboard = []; // 備用本機記憶體，確保無網路時也能記錄單次進度

        async function initFirebase() {
            try {
                const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
                const firebaseConfig = JSON.parse(configStr);
                
                if (Object.keys(firebaseConfig).length > 0) {
                    app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);

                    const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                    if (initialToken) {
                        await signInWithCustomToken(auth, initialToken);
                    } else {
                        await signInAnonymously(auth);
                    }
                    currentUser = auth.currentUser;
                }
            } catch (e) {
                console.error("Firebase init error:", e);
            }
        }
        initFirebase();

        // 題目資料 (根據附件內容整理)
        const quizData = [
            {
                question: "張國榮曾去哪裡見工，對方只給他「Office Boy」的職位？",
                options: ["律師樓", "銀行", "會計師樓", "報館"],
                answer: 0
            },
            {
                question: "他當時最大的憧憬是賺夠錢回哪裡繼續讀書？",
                options: ["美國", "英國", "加拿大", "澳洲"],
                answer: 1
            },
            {
                question: "在英國放長假時，他去了誰的姐姐開的餐館做「走保」？",
                options: ["尊龍", "陳百強", "傅聲", "許冠傑"],
                answer: 2
            },
            {
                question: "在英國做侍應，只要記住常客喜歡喝的什麼就能輕鬆應付？",
                options: ["咖啡", "甜品", "湯品", "酒類"],
                answer: 3
            },
            {
                question: "張國榮報名歌唱比賽時，靠賣什麼的微薄收入度日？",
                options: ["鞋子", "唱片", "牛仔褲", "手錶"],
                answer: 2
            },
            {
                question: "誰資助了張國榮報名歌唱比賽的費用？",
                options: ["母親", "中學同學", "鍾Sir", "六姐"],
                answer: 3
            },
            {
                question: "當時歌唱比賽的報名費是多少錢？",
                options: ["5元", "10元", "15元", "20元"],
                answer: 0
            },
            {
                question: "六姐給了他多少錢資助？",
                options: ["10元", "20元", "50元", "100元"],
                answer: 1
            },
            {
                question: "他去廣播道報名時，為了省錢最後轉搭什麼交通工具？",
                options: ["小巴", "的士", "巴士", "電車"],
                answer: 2
            },
            {
                question: "陪他去報名的同學在初賽的結果如何？",
                options: ["被淘汰 (foul)", "獲得冠軍", "獲得亞軍", "進入決賽"],
                answer: 0
            },
            {
                question: "張國榮在初賽選唱了哪首英文歌？",
                options: ["《Yesterday》", "《American Pie》", "《Let It Be》", "《Hey Jude》"],
                answer: 1
            },
            {
                question: "他唱了幾句就被評判按鈴叫停？",
                options: ["一、兩句", "三、四句", "六、七句", "十句以上"],
                answer: 2
            },
            {
                question: "他留意到哪位初賽評判態度很好、經常面帶微笑？",
                options: ["黃霑", "顧嘉煇", "鍾景輝 (鍾Sir)", "黎小田"],
                answer: 2
            },
            {
                question: "簽約麗的電視時，鍾Sir開出一個月多少錢薪水的合約？",
                options: ["五百元", "一千元", "兩千元", "三千元"],
                answer: 1
            },
            {
                question: "簽約後去服裝贊助商借衫時，他遭到店員冷落，讓他乾等了多久？",
                options: ["15 分鐘", "30 分鐘", "45 分鐘", "1 小時"],
                answer: 2
            }
        ];

        // 遊戲狀態變數
        let currentQuestionIndex = 0;
        let score = 0;
        let timeLeft = 100; // 10秒 (用 100 代表 100%，方便進度條計算)
        let timerInterval;
        let isAnswering = false;

        // 音效系統 (使用 Web Audio API 生成簡單音效)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                // 清脆的叮聲
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
                oscillator.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // A6
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                // 低沉的答錯聲
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // 畫面切換函數
        function switchScreen(hideId, showId) {
            const hideEl = document.getElementById(hideId);
            const showEl = document.getElementById(showId);
            
            hideEl.classList.remove('fade-in');
            hideEl.classList.add('fade-out');
            
            setTimeout(() => {
                hideEl.classList.add('hidden');
                hideEl.classList.remove('fade-out');
                
                showEl.classList.remove('hidden');
                showEl.classList.add('fade-in');
            }, 500); // 等待淡出動畫完成
        }

        // 開始遊戲
        function startGame() {
            // 初始化狀態
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('score-text').innerText = score;
            
            // 啟動音頻上下文 (瀏覽器需要使用者互動才能發聲)
            if (audioCtx.state === 'suspended') audioCtx.resume();

            switchScreen('start-screen', 'quiz-screen');
            setTimeout(loadQuestion, 500);
        }

        // 載入題目
        function loadQuestion() {
            if (currentQuestionIndex >= quizData.length) {
                endGame();
                return;
            }

            isAnswering = true;
            const qData = quizData[currentQuestionIndex];
            
            // 更新進度與題目文字
            document.getElementById('current-question-text').innerText = currentQuestionIndex + 1;
            document.getElementById('question-title').innerText = qData.question;
            
            // 清除之前的反饋訊息
            const feedbackMsg = document.getElementById('feedback-message');
            feedbackMsg.style.opacity = '0';
            feedbackMsg.innerText = '';

            // 生成選項按鈕
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full p-4 rounded-xl text-lg font-semibold shadow-sm';
                btn.innerText = opt;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });

            // 重置並啟動計時器
            timeLeft = 100;
            updateTimerUI();
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 100); // 每0.1秒更新
        }

        // 計時器邏輯
        function updateTimer() {
            timeLeft -= 1; // 100次 * 0.1秒 = 10秒
            updateTimerUI();

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                handleTimeOut();
            }
        }

        function updateTimerUI() {
            const bar = document.getElementById('timer-bar');
            bar.style.width = timeLeft + '%';
            
            if (timeLeft < 30) {
                bar.classList.add('urgent');
            } else {
                bar.classList.remove('urgent');
            }
        }

        // 處理選擇選項
        function selectOption(selectedIndex, btnElement) {
            if (!isAnswering) return;
            isAnswering = false;
            clearInterval(timerInterval);

            const correctIndex = quizData[currentQuestionIndex].answer;
            const optionsBtns = document.getElementById('options-container').children;

            // 標示正確與錯誤選項
            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score += 10;
                document.getElementById('score-text').innerText = score;
                showFeedback("答對了！", "#4a8546");
                playTone('correct');
            } else {
                btnElement.classList.add('wrong');
                optionsBtns[correctIndex].classList.add('correct'); // 顯示正確答案
                showFeedback("答錯了！", "#a84e4e");
                playTone('wrong');
            }

            // 禁用所有按鈕
            for(let btn of optionsBtns) {
                btn.disabled = true;
                btn.classList.remove('hover:bg-[#e8f0e7]', 'hover:border-[#a3bca1]');
                btn.style.cursor = 'default';
            }

            // 延遲後進入下一題
            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion();
            }, 2000);
        }

        // 處理超時
        function handleTimeOut() {
            if (!isAnswering) return;
            isAnswering = false;
            
            const correctIndex = quizData[currentQuestionIndex].answer;
            const optionsBtns = document.getElementById('options-container').children;
            
            optionsBtns[correctIndex].classList.add('correct');
            showFeedback("時間到！", "#a84e4e");
            playTone('wrong');

            for(let btn of optionsBtns) {
                btn.disabled = true;
                btn.style.cursor = 'default';
            }

            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion();
            }, 2000);
        }

        // 顯示反饋訊息
        function showFeedback(text, color) {
            const feedbackMsg = document.getElementById('feedback-message');
            feedbackMsg.innerText = text;
            feedbackMsg.style.color = color;
            feedbackMsg.style.opacity = '1';
        }

        // 遊戲結束
        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('final-score').innerText = score;
            
            const maxScore = quizData.length * 10;
            const commentEl = document.getElementById('result-comment');
            
            if (score === maxScore) {
                commentEl.innerText = "太厲害了！你對哥哥早期的事蹟瞭如指掌，完全是骨灰級粉絲！";
            } else if (score >= maxScore * 0.7) {
                commentEl.innerText = "非常棒！看來你對哥哥的演藝起步故事十分熟悉。";
            } else if (score >= maxScore * 0.4) {
                commentEl.innerText = "不錯喔！透過這個遊戲，相信你又更認識哥哥真實貼地的一面了。";
            } else {
                commentEl.innerText = "沒關係，哥哥的巨星之路也是從跌跌撞撞開始的，再挑戰一次吧！";
            }

            // 每次遊戲結束重置輸入框狀態
            document.getElementById('player-name').value = '';
            document.getElementById('name-feedback').innerText = '';
            const btn = document.getElementById('submit-score-btn');
            btn.disabled = false;
            btn.innerText = "提交成績並查看龍虎榜";

            switchScreen('quiz-screen', 'result-screen');
        }

        // 重新開始
        function resetGame() {
            switchScreen('leaderboard-screen', 'start-screen');
        }

        // --- 新增：龍虎榜相關功能 ---
        async function submitScore() {
            const nameInput = document.getElementById('player-name').value.trim();
            const feedbackEl = document.getElementById('name-feedback');
            
            if (!nameInput) {
                feedbackEl.innerText = "請輸入名字！";
                return;
            }
            feedbackEl.innerText = "";
            
            const btn = document.getElementById('submit-score-btn');
            btn.disabled = true;
            btn.innerText = "提交中...";

            const newRecord = {
                name: nameInput,
                score: score,
                timestamp: Date.now()
            };

            if (currentUser && db) {
                try {
                    const lbRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                    await addDoc(lbRef, newRecord);
                } catch (e) {
                    console.error("Error saving score:", e);
                    localLeaderboard.push(newRecord);
                }
            } else {
                localLeaderboard.push(newRecord);
            }
            
            await loadAndShowLeaderboard();
        }

        async function skipToLeaderboard() {
            await loadAndShowLeaderboard();
        }

        async function loadAndShowLeaderboard() {
            switchScreen('result-screen', 'leaderboard-screen');
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = '<li class="text-center py-4 text-[#4a5c49] font-bold">載入中...</li>';
            
            let records = [];
            if (currentUser && db) {
                try {
                    const lbRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                    const snapshot = await getDocs(lbRef); // 簡單查詢獲取所有數據
                    snapshot.forEach(doc => {
                        records.push(doc.data());
                    });
                } catch (e) {
                    console.error("Error fetching leaderboard:", e);
                    records = localLeaderboard;
                }
            } else {
                records = localLeaderboard;
            }

            // 在記憶體中進行排序：分數由高到低，同分則按完成時間先後
            records.sort((a, b) => {
                if (b.score !== a.score) {
                    return b.score - a.score;
                }
                return a.timestamp - b.timestamp;
            });

            // 提取前 10 名
            const top10 = records.slice(0, 10);
            
            listEl.innerHTML = '';
            if (top10.length === 0) {
                listEl.innerHTML = '<li class="text-center py-4 text-[#4a5c49]">暫無紀錄，成為第一位上榜者吧！</li>';
            } else {
                top10.forEach((rec, index) => {
                    const li = document.createElement('li');
                    li.className = 'flex justify-between items-center py-3 px-4 border-b border-[#c3d8c1] last:border-0 rounded-lg hover:bg-[rgba(255,255,255,0.5)] transition-colors';
                    
                    let rankStyle = "text-[#5c6d5b] text-lg";
                    let rankIcon = index + 1;
                    if (index === 0) { rankStyle = "text-yellow-600 font-black text-2xl"; rankIcon = "🥇"; }
                    else if (index === 1) { rankStyle = "text-gray-500 font-black text-xl"; rankIcon = "🥈"; }
                    else if (index === 2) { rankStyle = "text-amber-700 font-black text-xl"; rankIcon = "🥉"; }
                    
                    const safeName = escapeHTML(rec.name);
                    li.innerHTML = `
                        <div class="flex items-center gap-4 w-2/3">
                            <span class="w-8 text-center ${rankStyle}">${rankIcon}</span>
                            <span class="font-bold text-[#2c3e2e] truncate" title="${safeName}">${safeName}</span>
                        </div>
                        <div class="font-black text-[#4a8546] text-lg w-1/3 text-right">${rec.score} 分</div>
                    `;
                    listEl.appendChild(li);
                });
            }
        }

        // 防止 XSS 攻擊
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.innerText = str;
            return div.innerHTML;
        }

        // 將需要被 HTML inline 事件呼叫的函式綁定到全域 window 上
        window.startGame = startGame;
        window.resetGame = resetGame;
        window.submitScore = submitScore;
        window.skipToLeaderboard = skipToLeaderboard;

    </script>
</body>
</html>
